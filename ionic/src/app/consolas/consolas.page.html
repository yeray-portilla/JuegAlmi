<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-refresher slot="fixed" (ionRefresh)="cargar($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <h1 class="titulo">Consolas</h1>

  @if (cargando() && datos().length === 0) {
    <div class="estado"><ion-spinner name="crescent"></ion-spinner></div>
  } @else if (error()) {
    <div class="estado">
      <span class="err">{{ error() }}</span>
      <ion-button size="small" fill="outline" (click)="cargar()">Reintentar</ion-button>
    </div>
  } @else {
    @for (c of datos(); track c.id) {
      <ion-card class="prod">
        <ion-img [src]="api.urlFoto(c.foto_url)" [alt]="c.nombre" (ionError)="api.fotoRota($event)"></ion-img>
        <div class="info">
          <strong>{{ c.nombre }}</strong>
          <span class="muted">{{ c.marca }} · {{ c.almacenamiento }}</span>
          <span class="precio">{{ c.precio }} €</span>
          <div class="botones"><ion-button fill="solid" color="primary" [disabled]="c.stock === 0 || enviando()" (click)="comprar(c)">Comprar</ion-button></div>
        </div>
      </ion-card>
    } @empty {
      <div class="estado"><span class="muted">No hay consolas.</span></div>
    }
  }
</ion-content>
