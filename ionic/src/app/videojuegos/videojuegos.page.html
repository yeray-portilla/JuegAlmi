<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1 class="titulo">Videojuegos</h1>
  @for (v of datos; track v.id) {
    <div class="prod">
      <img [src]="v.foto" [alt]="v.titulo" loading="lazy">
      <div class="info">
        <strong>{{ v.titulo }}</strong>
        <span class="muted">{{ v.plataforma }}</span>
        <span class="precio">{{ v.venta }} € · alquiler {{ v.alquiler }} €/día</span>
        <div class="botones">
          <ion-button size="small">Comprar</ion-button>
          <ion-button size="small" fill="outline">Alquilar</ion-button>
        </div>
      </div>
    </div>
  }
</ion-content>
