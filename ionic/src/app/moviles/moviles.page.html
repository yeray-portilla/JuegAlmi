<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1 class="titulo">Móviles</h1>
  <div class="filtros">
    @for (f of filtros; track f) {
      <button [class.on]="f === filtro" (click)="filtro = f">{{ f }}</button>
    }
  </div>
  @for (p of lista; track p.id) {
    <div class="prod">
      <img [src]="p.foto" [alt]="p.nombre" loading="lazy">
      <div class="info">
        <strong>{{ p.nombre }}</strong>
        <span class="muted">{{ p.tipo }}</span>
        <span class="precio">{{ p.precio }} €</span>
        <div class="botones"><ion-button size="small" fill="outline">Comprar</ion-button></div>
      </div>
    </div>
  }
</ion-content>
